services:
  # PostgreSQL (local dev — production uses Supabase Postgres)
  postgres:
    image: supabase/postgres:15.1.0.117
    restart: unless-stopped
    ports:
      - "54322:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    networks:
      - portico-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Apply schema migrations using Atlas
  schema_migrator:
    image: arigaio/atlas:latest
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database/schema.sql:/schema.sql
    command: >
      schema apply
        --url "postgresql://postgres:postgres@postgres:5432/postgres?search_path=public&sslmode=disable"
        --to "file:///schema.sql"
        --auto-approve
    networks:
      - portico-network

  # Rust engine — workflow orchestrator
  engine:
    build:
      context: ..
      dockerfile: ./server/engine/Dockerfile
    ports:
      - "50051:50051"
      - "8080:8080"    # Health check endpoint
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
      - GRPC_PORT=50051
      - HEALTH_PORT=8080
      - PYTHON_SIDECAR_URL=http://python-sidecar:8001
      - AI_GATEWAY_URL=https://ai-gateway.vercel.sh
      - AI_GATEWAY_API_KEY=${AI_GATEWAY_API_KEY:-}
      - MEDPLUM_BASE_URL=${MEDPLUM_BASE_URL:-https://api.medplum.com}
      - MEDPLUM_CLIENT_ID=${MEDPLUM_CLIENT_ID:-}
      - MEDPLUM_CLIENT_SECRET=${MEDPLUM_CLIENT_SECRET:-}
      - REDIS_URL=${REDIS_URL:-}
    networks:
      - portico-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Python sidecar — sandboxed Python step execution
  python-sidecar:
    build:
      context: ./python-sidecar
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - MAX_EXECUTION_TIME=60
    networks:
      - portico-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  portico-network:
    driver: bridge

volumes:
  postgres_data:
