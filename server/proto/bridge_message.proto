syntax = "proto3";

package portico;

import "google/protobuf/struct.proto";

service BridgeService {
  // Initialize server connection
  rpc InitServer(ServerInitRequest) returns (GeneralResponse);

  // Process signals
  rpc ProcessSignal(SignalRequest) returns (SignalResponse);

  // Process changes
  rpc CreateWorkflow(CreateWorkflowRequest) returns (GeneralResponse);
  rpc DeleteWorkflow(DeleteWorkflowRequest) returns (GeneralResponse);

  // Agent composition
  rpc PlanWorkflow(PlanWorkflowRequest) returns (PlanWorkflowResponse);
}

// === Core definitions ===
// Server initialization
message ServerInitRequest {
  bool server_init = 1;
}

message GeneralResponse {
  bool success = 1;
  string message = 2;
}

// Signal request structure
message SignalRequest {
  int32 signal_id = 1;
  int32 workflow_id = 2;
  SignalType signal_type = 3;

  // Optional payload based on signal type
  oneof payload {
    google.protobuf.Struct run_data = 4;
    SyncPayload sync = 5;
    google.protobuf.Struct fyi_data = 6;
  }

  // v2 additions
  string source = 7;                         // webhook | medplum-subscription | ui | api
  string idempotency_key = 8;                // dedupe key
  google.protobuf.Struct source_metadata = 9; // message type, sending facility, etc.
  string signal_uuid = 10;                    // UUID string for v2 signals
}

// Response with the result of processing the signal
message SignalResponse {
  bool success = 1;
  string message = 2;
  string runtime_session_uuid = 3;
  google.protobuf.Struct result_data = 4;
}

message CreateWorkflowRequest {
  google.protobuf.Struct workflow_json = 1;
}

message DeleteWorkflowRequest {
  int32 workflow_id = 1;
}

message PlanWorkflowRequest {
  int32 agent_id = 1;
  string objective = 2;
  google.protobuf.Struct context = 3;
  google.protobuf.Struct constraints = 4;
  bool is_ephemeral = 5;
}

message PlanWorkflowResponse {
  bool success = 1;
  string message = 2;
  google.protobuf.Struct workflow_spec = 3;
  repeated string validation_errors = 4;
  int32 estimated_steps = 5;
  bool requires_approval = 6;
  string workflow_uuid = 7; // If workflow was created
}

// === Sub definitions ===

enum SignalType {
  RUN = 0;
  SYNC = 1;
  FYI = 2;
}

message SyncPayload {
  // Sync scope
  SyncScope scope = 1;

  // Optional specific UUIDs to sync (if not ALL)
  repeated string workflow_uuids = 2;
}

enum SyncScope {
  ALL = 0;
  SPECIFIC = 1;
}
