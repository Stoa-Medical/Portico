[package]
name = "portico-engine"
version = "0.2.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde_json = "1.0"
anyhow = "1.0.95"
dotenvy = "0.15.7"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "tls-native-tls", "uuid", "chrono", "json"] }
uuid = { version = "1.6.1", features = ["v4"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["json"] }
